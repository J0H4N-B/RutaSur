<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{% endblock %} · RutaSur</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='tema.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark barra mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('main.index') }}">
        <img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="30" height="30"> RutaSur
      </a>
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('main.exportar') }}?{{ query }}">
        <i class="bx bx-download"></i> Exportar CSV
      </a>
    </div>
  </nav>
  <main class="container pb-5">
    {% block contenido %}{% endblock %}
  </main>
  <footer class="pie">Recreación de un proyecto de pasantía. Todos los datos son ficticios.</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
